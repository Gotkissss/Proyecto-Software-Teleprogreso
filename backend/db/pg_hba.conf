# =============================================================================
# pg_hba.conf — Reglas de autenticación del servidor PostgreSQL
# -----------------------------------------------------------------------------
# Este archivo se monta READ-ONLY dentro del contenedor y se le pasa a Postgres
# con `-c hba_file=/etc/postgresql/pg_hba.conf` desde docker-compose.yml.
#
# Se monta en vez de dejar que initdb lo genere dentro de PGDATA porque el
# archivo generado solo se escribe la PRIMERA vez que se crea el volumen: si
# el volumen ya existía, esas reglas nunca se actualizarían. Montándolo, estas
# reglas se aplican en TODOS los arranques, con volumen nuevo o viejo.
#
# Orden de evaluación: Postgres usa la PRIMERA línea que casa. La última línea
# es un `reject` general, así que todo lo que no esté explícitamente permitido
# arriba queda denegado.
#
# Reglas:
#   1. Socket unix local  -> trust. Solo alcanzable por procesos que ya están
#      DENTRO del contenedor db (quien llegue ahí ya tiene el contenedor). Es
#      necesario para el arranque: el entrypoint oficial de la imagen crea la
#      base y ejecuta los scripts de init por el socket sin contraseña.
#   2. TCP desde loopback del propio contenedor -> contraseña scram.
#   3. TCP desde la subred del contenedor (`samenet`: la red bridge de Docker,
#      incluye al backend y al gateway por el que entra el puerto publicado)
#      -> contraseña scram obligatoria.
#   4. Todo lo demás -> reject, sin excepciones.
#
# scram-sha-256 en todas las líneas TCP: nunca `trust`, nunca `md5`, nunca
# `password` (texto plano). Un cliente que no soporte SCRAM no entra.
# =============================================================================

# TYPE   DATABASE   USER   ADDRESS          METHOD

# --- 1. Socket unix interno del contenedor -----------------------------------
local    all        all                     trust

# --- 2. Loopback dentro del contenedor ---------------------------------------
host     all        all    127.0.0.1/32     scram-sha-256
host     all        all    ::1/128          scram-sha-256

# --- 3. Red interna de Docker (backend + gateway del puerto publicado) -------
host     all        all    samenet          scram-sha-256

# --- 4. Cualquier otro origen: denegado ---------------------------------------
# Sin esta línea Postgres ya rechazaría por defecto, pero se deja explícita
# para que quede claro que no hay ninguna vía adicional y para que el intento
# quede registrado en el log como rechazo de política.
host     all        all    all              reject
hostssl  all        all    all              reject
