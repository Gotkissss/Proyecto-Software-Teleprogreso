# CI — Teleprogreso S.A.
# Corre en cada push y pull request hacia develop/main.
# Frontend: lint + build.  Backend: tests con pytest.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Valores dummy: los tests no tocan la BD real (usan dependency_overrides)
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
      DATABASE_URL_SYNC: postgresql://test:test@localhost:5432/test
      # Pública por estar en el repositorio: solo sirve para la suite. Tiene 32
      # bytes o más porque PyJWT avisa (InsecureKeyLengthWarning) con llaves
      # HS256 más cortas, y ese aviso se repetía en cada prueba que firma.
      SECRET_KEY: ci-secret-key-solo-para-tests-no-produccion
      # En cualquier otro entorno la app se niega a arrancar con una SECRET_KEY
      # de menos de 32 caracteres. ENVIRONMENT=test es la única excepción, y
      # existe justamente para esto: que la suite pueda usar llaves de juguete
      # sin que eso abra la puerta a desplegar con una.
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -v

  dependencias:
    name: Auditoría de dependencias (informativa)
    runs-on: ubuntu-latest
    # T1 del Sprint 9: pip-audit y npm audit en cada PR. Primera vuelta
    # INFORMATIVA: si encuentra avisos el job sale en rojo pero no bloquea el
    # PR. Pendientes conocidos al cerrar el Sprint 9 (ver SEGURIDAD.md):
    # python-jose/ecdsa/pyasn1, python-dotenv y pytest en el backend; axios,
    # form-data y react-router (producción) y las herramientas de build y
    # pruebas en el frontend. Cuando se resuelvan, se quita
    # `continue-on-error` y pasa a ser bloqueante.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: pip-audit (backend)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --desc
      - uses: actions/setup-node@v4
        if: always()
        with:
          node-version: 20
      - name: npm audit (frontend, severidad alta o mayor)
        if: always()
        working-directory: frontend
        run: npm audit --audit-level=high
