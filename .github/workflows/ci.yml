# CI — Teleprogreso S.A.
# Corre en cada push y pull request hacia develop/main.
# Frontend: lint + build.  Backend: tests con pytest.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# El token del CI solo puede leer el repositorio. Ningún job necesita escribir,
# y así una Action comprometida no puede empujar código ni tocar releases.
permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Valores dummy: los tests no tocan la BD real (usan dependency_overrides)
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
      DATABASE_URL_SYNC: postgresql://test:test@localhost:5432/test
      # Pública por estar en el repositorio: solo sirve para la suite. Tiene 32
      # bytes o más porque PyJWT avisa (InsecureKeyLengthWarning) con llaves
      # HS256 más cortas, y ese aviso se repetía en cada prueba que firma.
      SECRET_KEY: ci-secret-key-solo-para-tests-no-produccion
      # En cualquier otro entorno la app se niega a arrancar con una SECRET_KEY
      # de menos de 32 caracteres. ENVIRONMENT=test es la única excepción, y
      # existe justamente para esto: que la suite pueda usar llaves de juguete
      # sin que eso abra la puerta a desplegar con una.
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -v

  dependencias:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    # Obligatoria desde la HU-S10-03: un aviso conocido rompe el job y el PR
    # no se puede mergear. Lo que se acepta sin corregir está en la tabla de
    # excepciones de SEGURIDAD.md ("Cadena de suministro"), con motivo y fecha
    # de revisión; aquí no se silencia nada con `|| true`.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: pip-audit (backend)
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r backend/requirements.txt --desc
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        # always(): si pip-audit falla, npm audit corre igual para que el PR
        # muestre los dos resultados de una vez.
        if: always()
        with:
          node-version: 20
      - name: npm audit (frontend en producción, severidad alta o mayor)
        if: always()
        working-directory: frontend
        # --omit=dev: las herramientas de build y pruebas no llegan al
        # navegador; sus avisos se aceptan en SEGURIDAD.md.
        run: npm audit --omit=dev --audit-level=high

  secretos:
    name: Detección de secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Historial completo: gitleaks recorre los commits del rango, no
          # solo el último.
          fetch-depth: 0
      # El binario oficial, con versión fija y su SHA-256 comprobado, en lugar
      # de una Action más que habría que fijar y vigilar. Al subir de versión
      # se cambian los dos valores juntos (gitleaks_<versión>_checksums.txt).
      - name: Instalar gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz
      # Solo los commits que trae el PR (o el push): el historial viejo ya se
      # revisó al introducir esta comprobación. Las excepciones viven en
      # .gitleaks.toml.
      - name: Buscar secretos en los commits nuevos
        env:
          EVENTO: ${{ github.event_name }}
          BASE_PR: ${{ github.event.pull_request.base.sha }}
          CABEZA_PR: ${{ github.event.pull_request.head.sha }}
          ANTES: ${{ github.event.before }}
        run: |
          if [ "$EVENTO" = "pull_request" ]; then
            rango="$BASE_PR..$CABEZA_PR"
          elif git cat-file -e "$ANTES^{commit}" 2>/dev/null; then
            rango="$ANTES..$GITHUB_SHA"
          else
            # Rama nueva o push forzado: no hay un "antes" en el historial.
            rango="-1 $GITHUB_SHA"
          fi
          echo "Rango revisado: $rango"
          ./gitleaks git --no-banner --redact --config .gitleaks.toml --log-opts="$rango" .

  imagenes:
    name: Imágenes de producción (cabeceras y usuario)
    runs-on: ubuntu-latest
    # HU-S10-06: lo que se despliega es la imagen, no el código suelto. Estas
    # pruebas construyen las dos imágenes y comprueban lo que no se ve con las
    # pruebas unitarias: las cabeceras de seguridad que manda nginx en cada
    # tipo de archivo, la caché de la PWA, que ningún contenedor corre como
    # root y en qué proxy confía uvicorn.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Frontend — cabeceras, caché y nginx sin root
        run: scripts/verificar-cabeceras-frontend.sh
      - name: Backend — sin compilador, sin root y proxy
        run: scripts/verificar-imagen-backend.sh
  escaneo-dinamico:
    name: Escaneo dinámico (OWASP ZAP, informativo)
    runs-on: ubuntu-latest
    # T2 del Sprint 10. Todo lo demás de este CI mira el código: los tests, la
    # auditoría de dependencias, las cabeceras de la imagen. Esto mira la API
    # CORRIENDO, que es lo único que se parece a lo que ve un atacante —y lo
    # único que puede encontrar algo que nadie pensó en escribir una prueba
    # para.
    #
    # Es INFORMATIVO a propósito, y no por pereza: un escáner dinámico sobre
    # una API que exige JWT en los 68 endpoints devuelve sobre todo "401" y
    # algún aviso de cabeceras que ya están puestas. Bloquear PRs con eso
    # acabaría en que alguien quita el job. Lo que se busca es el informe, que
    # queda como artefacto y es la evidencia externa de la cobertura OWASP para
    # la presentación.
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Levantar la API con docker compose
        run: |
          set -euo pipefail
          # Un .env mínimo: el compose exige estas variables y el backend se
          # niega a arrancar con una SECRET_KEY débil (core/config.py), así
          # que se genera una de verdad para este escaneo.
          cat > .env <<EOF
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          POSTGRES_DB=teleprogreso
          POSTGRES_PORT=5432
          SECRET_KEY=$(openssl rand -hex 48)
          BIND_HOST=0.0.0.0
          ENVIRONMENT=development
          BACKEND_CORS_ORIGINS=["http://localhost:5173"]
          EOF
          docker compose up -d db migraciones backend
          # El healthcheck de la imagen no cubre el arranque completo (las
          # migraciones y el seed corren antes de uvicorn), así que se espera
          # a que la API responda de verdad.
          for intento in $(seq 1 90); do
            if curl -fsS -o /dev/null http://localhost:8000/health; then
              echo "API arriba tras $intento s"
              break
            fi
            sleep 1
          done
          curl -fsS http://localhost:8000/health

      - name: ZAP (reglas pasivas sobre la API)
        # `zap-api-scan.py` y no `zap-baseline.py`: las dos corren las mismas
        # reglas pasivas, pero baseline descubre las rutas spidereando enlaces
        # y esto es una API JSON sin una sola página que enlace a otra — vería
        # tres endpoints y se iría. api-scan lee el `openapi.json` y recorre
        # los 68, que es lo que hace que el informe sirva de evidencia.
        #
        # Por eso el compose arranca con ENVIRONMENT=development: en producción
        # el `openapi.json` no se publica a propósito (es un mapa completo de la
        # superficie de ataque), así que el escaneo tiene que correr contra un
        # entorno donde sí esté.
        #
        # `-I` hace que ZAP no termine en error por los avisos; el `|| true`
        # cubre que el propio contenedor termine mal, que tampoco debe romper el
        # CI al ser informativo.
        run: |
          mkdir -p reportes-zap
          # ZAP escribe el informe con el usuario del contenedor: sin esto no
          # puede crear nada en el volumen montado.
          chmod 777 reportes-zap
          docker run --rm --network host \
            -v "$PWD/reportes-zap:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py \
              -t http://localhost:8000/openapi.json \
              -f openapi \
              -I \
              -r informe-zap.html \
              -w informe-zap.md \
              -J informe-zap.json \
            || true
          ls -la reportes-zap || true

      - name: Resumen en el log del job
        if: always()
        run: |
          if [ -f reportes-zap/informe-zap.md ]; then
            # Lo más útil del informe en el propio log, para no tener que
            # descargar el artefacto solo para ver si hay algo.
            head -60 reportes-zap/informe-zap.md
          else
            echo "ZAP no dejó informe; revisa el paso anterior."
          fi

      - name: Guardar el informe
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: informe-zap
          path: reportes-zap/
          if-no-files-found: warn

      - name: Apagar
        if: always()
        run: docker compose down -v || true
