# CI — Teleprogreso S.A.
# Corre en cada push y pull request hacia develop/main.
# Frontend: lint + build.  Backend: tests con pytest.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Valores dummy: los tests no tocan la BD real (usan dependency_overrides)
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
      DATABASE_URL_SYNC: postgresql://test:test@localhost:5432/test
      SECRET_KEY: ci-secret-key-solo-para-tests
      # En cualquier otro entorno la app se niega a arrancar con una SECRET_KEY
      # tan corta como la de arriba. ENVIRONMENT=test es la única excepción, y
      # existe justamente para esto: que la suite pueda usar llaves de juguete
      # sin que eso abra la puerta a desplegar con una.
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -v
