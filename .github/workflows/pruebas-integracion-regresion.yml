name: Pruebas de integracion y regresion

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

# Solo lectura: el token no puede empujar código ni tocar releases. Subir el
# artefacto de reportes no necesita permisos sobre el contenido.
permissions:
  contents: read

jobs:
  integracion-regresion:
    name: Integracion y regresion (PostgreSQL + PostGIS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # Mismo digest que el servicio db de docker-compose.yml: las pruebas
        # corren contra la misma base que se despliega. Si Dependabot mueve
        # uno, se copia al otro.
        image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: teleprogreso_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d teleprogreso_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/teleprogreso_test
      DATABASE_URL_SYNC: postgresql://postgres:postgres@localhost:5432/teleprogreso_test
      EXIGIR_BD_PRUEBAS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      # Sin ENVIRONMENT=test: Settings valida la SECRET_KEY igual que en un despliegue real.
      - name: Generar SECRET_KEY aleatoria
        run: |
          clave=$(python -c "import secrets; print(secrets.token_urlsafe(48))")
          echo "::add-mask::$clave"
          echo "SECRET_KEY=$clave" >> "$GITHUB_ENV"
      - name: Aplicar migraciones
        run: alembic upgrade head
      # DoD del Sprint 9: toda migración se prueba en los dos sentidos. Se baja
      # hasta antes de la bitácora (0009 y 0010) y se vuelve a subir.
      - name: Migraciones ida y vuelta
        run: alembic downgrade 0008 && alembic upgrade head
      - name: Pruebas de integracion
        run: python -m pytest -m integracion -v -rs --junitxml=reportes/integracion.xml
      - name: Pruebas de regresion
        if: always()
        run: python -m pytest -m regresion -v -rs --junitxml=reportes/regresion.xml
      - name: Subir reportes JUnit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reportes-integracion-regresion
          path: backend/reportes/
          if-no-files-found: warn
